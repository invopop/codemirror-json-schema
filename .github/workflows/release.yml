name: Release

# Publishes @invopop/codemirror-json-schema whenever main has a package.json
# version that isn't on npm yet: bump the version in a pull request and the
# merge releases it. npm authenticates this workflow through trusted
# publishing, so no token is stored; see "Releasing" in CONTRIBUTING.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version from packageManager

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: pnpm vitest run --dom

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install --global npm@11
          npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
